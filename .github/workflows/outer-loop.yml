# Reusable factory outer loop (loop-kernel §0/§2). Target projects call it from
# .github/workflows/factory.yml (template: skills/loop-kernel/factory-workflow.yml).
# Runs .factory/checks + test-guard against the PR base, then mutate-check.
name: factory outer loop
on:
  workflow_call:
    inputs:
      setup:
        description: Command that installs dependencies before checks (e.g. npm ci)
        type: string
        default: ""
      test-command:
        description: Full test command; enables mutate-check when set
        type: string
        default: ""
      oroskills-ref:
        description: oroskills ref to take the kernel scripts from
        type: string
        default: main
jobs:
  outer-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: omerronen48/oroskills
          ref: ${{ inputs.oroskills-ref }}
          path: .oroskills
      - name: Setup
        if: inputs.setup != ''
        env:
          SETUP: ${{ inputs.setup }}
        run: bash -c "$SETUP"
      - name: factory-check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .oroskills/skills/loop-kernel/factory-check.sh "$BASE"
      - name: mutate-check
        if: inputs.test-command != ''
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash .oroskills/skills/loop-kernel/mutate-check.sh "$BASE" "$TEST_COMMAND"
